name: Small offline editor tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bash setup.sh --minimal --with-test --with-docs
      - run: .venv/bin/python -m pytest -q tests
      - run: node tests/test_ranges.mjs
      - run: node tests/test_tasks.mjs
